# Build-only downloads: curl honors Retry-After and backs off on transient errors.
# Bound both each attempt and the retry window; permanent errors still fail.
ParallelDownloads = 1
XferCommand = /usr/bin/curl --disable --fail --location --show-error --silent --connect-timeout 30 --max-time 300 --retry 8 --retry-max-time 600 --output %o -- %u
